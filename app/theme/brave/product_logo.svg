<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141F3A"/>
      <stop offset="1" stop-color="#070B16"/>
    </linearGradient>
    <linearGradient id="bird" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1D9BFF"/>
      <stop offset="1" stop-color="#9BEDFF"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <!-- falcon, side view mid-flap, flying right and slightly down -->
  <g transform="translate(126 138) rotate(16) scale(0.84)" fill="url(#bird)">
    <!-- body, head, hooked beak -->
    <path d="M 96 2
             L 90 12 L 82 10
             L 74 -2
             Q 64 -22 40 -20
             Q 0 -18 -52 -7
             L -56 7
             Q 0 20 44 18
             Q 68 18 80 8 Z"/>
    <!-- raised wing: broad, three fingered tips -->
    <path d="M 30 -18
             Q -4 -56 -30 -132
             L -44 -110
             L -60 -124
             L -62 -98
             L -84 -106
             Q -40 -60 4 -20 Z"/>
    <!-- trailing wing -->
    <path d="M -8 16
             Q -54 52 -112 76
             L -108 56
             L -96 60
             Q -58 34 -24 8 Z"/>
    <!-- notched tail -->
    <path d="M -52 -7
             L -116 -22 L -106 -4
             L -120 12 L -102 12
             L -56 7 Z"/>
    <!-- eye -->
    <circle cx="62" cy="-8" r="4.5" fill="#070B16"/>
  </g>
</svg>
