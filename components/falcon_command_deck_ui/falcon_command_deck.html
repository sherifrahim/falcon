<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Quick commands</title>
  <link rel="stylesheet" href="chrome://resources/css/text_defaults.css">
  <script src="chrome://resources/js/load_time_data_deprecated.js"></script>
  <script src="/strings.js"></script>
  <script src="/falcon_command_deck.bundle.js"></script>
  <style>
    html, body { margin: 0; }
    body {
      width: 760px;
      background: transparent;
      color: #e2e8f0;
      font-family: Inter, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    #root { width: 760px; }
  
    /* Motion is a courtesy, not a requirement: honour the OS setting across
       every rule in this bundle, including ones added later. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
</body>

</html>
