<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>New Tab</title>
  <script src="chrome://resources/js/load_time_data_deprecated.js"></script>
  <script src="/strings.js"></script>
  <script src="/falcon_newtab.bundle.js"></script>
  <style>
    html[data-black] {
      --f-bg-0: #000; --f-bg-1: #050505; --f-bg-2: #0a0a0a; --f-bg-3: #121212; --f-border: #1f1f1f;
      --leo-color-page-background: #000; --leo-color-container-background: #050505;
      --leo-color-divider-subtle: #1f1f1f; --leo-color-container-highlight: #0a0a0a;
    }
    html, body, #root { height: 100%; margin: 0; }
    body {
      background: #0b1220;
      color: #f1f5f9;
      font-family: Inter, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    * { box-sizing: border-box; }
  
    /* Motion is a courtesy, not a requirement: honour the OS setting across
       every rule in this bundle, including ones added later. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
</body>

</html>
