# Falcon release: Windows installer + Android APK, built on the two self-hosted
# runners on the dev laptop (Windows host + WSL) — GitHub-hosted runners cannot
# build Chromium (disk/time). Trigger by pushing a tag `v<semver>` (must match
# components/constants/falcon_version.h) or manually from the Actions tab.
#
# Both jobs share one concurrency group so they never build at the same time
# (one laptop). Each job works inside its existing checkout; nothing is cloned.
# The Windows runner has only Windows PowerShell 5.1 (no pwsh) and a Restricted
# execution policy, hence the explicit shell template.
name: Falcon release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of brave-core (falcon) to build
        default: falcon
        required: true
      platforms:
        description: What to build
        type: choice
        options: [both, windows, android]
        default: both
      publish:
        description: Publish a GitHub Release (otherwise only upload artifacts)
        type: boolean
        default: false

permissions:
  contents: write

env:
  FALCON_REF: ${{ github.event.inputs.ref || github.ref_name }}

jobs:
  windows:
    if: github.event_name == 'push' || github.event.inputs.platforms != 'android'
    runs-on: [self-hosted, windows, falcon]
    timeout-minutes: 600
    concurrency: { group: falcon-build, cancel-in-progress: false }
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: D:\falcon\bb\src\brave
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Sync brave-core to the requested ref
        run: |
          if (git status --porcelain) { throw "Working tree at D:\falcon\bb\src\brave is not clean; commit or stash before releasing." }
          git fetch --tags origin
          git checkout --detach ${{ env.FALCON_REF }}
          git log --oneline -1
          pnpm install --frozen-lockfile

      - name: Read Falcon version
        id: ver
        run: |
          $h = Get-Content components/constants/falcon_version.h -Raw
          $v = [regex]::Match($h, 'kFalconVersion\[\] = "([^"]+)"').Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Falcon version $v"
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$v") {
            throw "Tag ${{ github.ref_name }} does not match falcon_version.h (v$v)"
          }

      - name: Build + package (Static)
        run: D:\falcon\tools\package.ps1 -Config Static -Version ${{ steps.ver.outputs.version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: falcon-windows-x64
          path: |
            D:\falcon\dist\*.exe
            D:\falcon\dist\*.zip
            D:\falcon\dist\SHA256SUMS.txt
            D:\falcon\dist\RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

      - name: Return the checkout to the falcon branch
        if: always()
        run: git checkout falcon

  android:
    if: github.event_name == 'push' || github.event.inputs.platforms != 'windows'
    runs-on: [self-hosted, linux, falcon-android]
    timeout-minutes: 900
    concurrency: { group: falcon-build, cancel-in-progress: false }
    defaults:
      run:
        shell: bash
    steps:
      - name: Build + package (arm64 APK)
        run: bash /mnt/d/falcon/tools/wsl-android-package.sh "${FALCON_REF}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: falcon-android-arm64
          path: |
            /mnt/d/falcon/dist-android/*.apk
            /mnt/d/falcon/dist-android/SHA256SUMS-android.txt
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [windows, android]
    if: always() && (github.ref_type == 'tag' || github.event.inputs.publish == 'true') && contains(needs.*.result, 'success') && !contains(needs.*.result, 'failure')
    runs-on: [self-hosted, windows, falcon]
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: D:\falcon\release-stage

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = '${{ needs.windows.outputs.version }}'
          if (-not $ver) { $h = Get-Content D:\falcon\bb\src\brave\components\constants\falcon_version.h -Raw; $ver = [regex]::Match($h, 'kFalconVersion\[\] = "([^"]+)"').Groups[1].Value }
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { "v$ver" }
          $stage = 'D:\falcon\release-stage'
          $files = Get-ChildItem $stage -Recurse -File | Where-Object { $_.Name -match '\.(exe|zip|apk)$' -or $_.Name -like 'SHA256SUMS*' } | ForEach-Object { $_.FullName }
          $notes = Get-ChildItem $stage -Recurse -Filter RELEASE_NOTES.md | Select-Object -First 1
          $notesArg = if ($notes) { @('--notes-file', $notes.FullName) } else { @('--notes', "Falcon $tag") }
          # Windows PowerShell 5.1 turns redirected native stderr into a terminating error; probe via cmd.
          cmd /c "gh release view $tag --repo ${{ github.repository }} >nul 2>&1"
          $exists = ($LASTEXITCODE -eq 0)
          if (-not $exists) {
            gh release create $tag --repo ${{ github.repository }} --target ${{ env.FALCON_REF }} --title "Falcon $tag" --latest @notesArg $files
          } else {
            gh release upload $tag --repo ${{ github.repository }} --clobber $files
          }
          Remove-Item -Recurse -Force $stage
